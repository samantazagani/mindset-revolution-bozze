<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mindset Revolution C Chiara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200..500;1,200..400&family=DM+Sans:opsz,wght@9..40,300..600&display=swap">
<style>
/* Versione C chiara, senza articoli, rifinita per mobile. Layout: composizione simmetrica e centrata, nome al centro dell'header.
   Motivo grafico: linee ondulate che si aprono al centro e svaniscono ai lati, dietro il titolo (come nella versione A).
   I 5 passaggi compaiono solo nella sezione percorso.
   Su telefono: menu a scomparsa, hero con archi ridisegnati, pulsante di prenotazione fisso in basso. */
:root {
  --bg: #f7f7fb;
  --surface: #ffffff;
  --surface-2: #eceef8;
  --line: #dadeed;
  --fg: #14162b;
  --text: #3a3e5b;
  --muted: #666b8a;
  --accent: #4651b0;
  --display: "Jost", "Century Gothic", "Avenir Next", sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--body); font-size: 17px; line-height: 1.72; font-weight: 400;
  margin: 0; overflow-x: clip;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 300; margin: 0; color: var(--fg); text-wrap: balance; line-height: 1.08; letter-spacing: 0; }
p { margin: 0; }
em { font-style: italic; color: var(--accent); font-weight: 300; }

.label { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.label::before, .label::after { content: ""; height: 1px; width: 44px; background: var(--line); }
.head { text-align: center; display: grid; justify-items: center; gap: 22px; }
.head h2 { font-size: clamp(36px, 5.6vw, 68px); max-width: 18ch; }
.head p { max-width: 56ch; color: var(--text); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.hdr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-block: 18px; }
.hdr nav { display: flex; gap: 6px 30px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.hdr nav.r { justify-content: flex-end; }
.hdr nav a { padding-block: 4px; transition: color .2s; }
.hdr nav a:hover, .hdr nav a[aria-current="page"] { color: var(--fg); }
.hdr nav a.cta { color: var(--accent); border-bottom: 1px solid var(--accent); }
.brand { font-family: var(--display); font-size: 22px; font-weight: 400; letter-spacing: 0.34em; text-transform: uppercase; color: var(--fg); text-align: center; line-height: 1.1; }
.brand small { display: block; margin-top: 4px; font-family: var(--body); font-size: 10px; letter-spacing: 0.4em; color: var(--muted); font-weight: 500; }
.menu-btn, .mnav, .dock { display: none; }
.mnav[hidden] { display: none !important; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 34px; background: var(--accent); color: #ffffff; border: 1px solid var(--accent); border-radius: 999px; font: 500 13px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: background .2s, color .2s; text-align: center; }
.btn:hover { background: transparent; color: var(--accent); }
.btn.ghost { background: transparent; color: var(--fg); border-color: #c2c6dc; }
.btn.ghost:hover { border-color: var(--fg); }
.textlink { color: var(--accent); border-bottom: 1px solid var(--accent); padding-bottom: 3px; font-size: 15px; }
.textlink:hover { color: var(--fg); border-color: var(--fg); }

/* hero */
.hero { position: relative; text-align: center; padding-top: clamp(64px, 10vw, 128px); display: grid; justify-items: center; }
.hero h1 { font-size: clamp(44px, 8vw, 104px); max-width: 15ch; font-weight: 300; }
.hero .lead { max-width: 58ch; margin-top: 30px; font-size: 19px; font-weight: 300; }
.hero .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 36px; }
.hero > *:not(.hero-art) { position: relative; z-index: 1; }
.hero-art { position: absolute; left: 50%; top: 44%; width: min(1500px, 100vw); height: clamp(420px, 62vw, 640px); transform: translate(-50%, -50%); pointer-events: none; z-index: 0; }
.hero-art svg { display: block; width: 100%; height: 100%; }
.numbers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: clamp(56px, 8vw, 104px) 0 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; width: 100%; }
.numbers > div { padding: 30px 12px; display: flex; flex-direction: column; min-width: 0; }
.numbers > div + div { border-left: 1px solid var(--line); }
.numbers dd { margin: 0; font-family: var(--display); font-size: clamp(36px, 4.4vw, 54px); font-weight: 300; color: var(--fg); line-height: 1.05; }
.numbers dt { order: 2; margin-top: 8px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

section.block { padding-block: clamp(80px, 11vw, 144px) 0; scroll-margin-top: 90px; }

/* metodo */
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(24px, 4vw, 56px); margin-top: 64px; text-align: center; }
.three > div { display: grid; justify-items: center; gap: 12px; padding: 8px 8px 0; min-width: 0; }
.three svg { width: 96px; height: 56px; margin-bottom: 14px; }
.three h3 { font-size: clamp(36px, 4vw, 48px); font-weight: 300; }
.three .w { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.three p.t { max-width: 32ch; }
.center { text-align: center; margin-top: 48px; }

/* storia */
.story { display: grid; justify-items: center; gap: 40px; }
.round { position: relative; width: min(340px, 78vw); aspect-ratio: 1; }
.round svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.round .photo { position: absolute; inset: 14%; width: 72%; height: 72%; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 1px solid var(--line); background: var(--surface-2); }
.prose { display: grid; gap: 22px; max-width: 62ch; }
.prose strong { color: var(--fg); font-weight: 500; }
.sig { font-family: var(--display); font-style: italic; font-weight: 300; font-size: 34px; color: var(--fg); }
.pull { max-width: 24ch; text-align: center; margin: clamp(56px, 8vw, 100px) auto 0; font-family: var(--display); font-weight: 300; font-size: clamp(30px, 4.6vw, 56px); line-height: 1.15; color: var(--fg); text-wrap: balance; }
.pull svg { display: block; margin: 0 auto 28px; width: 72px; height: 40px; }
.pull small { display: block; margin-top: 26px; font-family: var(--body); font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* percorso */
.stepper { list-style: none; margin: 72px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; position: relative; }
.stepper::before { content: ""; position: absolute; top: 25px; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, var(--line), var(--accent) 50%, var(--line)); }
.stepper li { position: relative; display: grid; justify-items: center; text-align: center; gap: 10px; min-width: 0; }
.stepper .num { position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--accent); color: var(--fg); font-family: var(--display); font-size: 22px; font-weight: 400; margin-bottom: 14px; }
.stepper h3 { font-size: 24px; font-weight: 400; line-height: 1.15; }
.stepper p { font-size: 15px; color: var(--text); max-width: 26ch; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 56px; }
.chip { padding: 8px 18px; border: 1px solid #c2c6dc; border-radius: 999px; font-size: 14px; color: var(--fg); background: var(--surface); }

/* per chi */
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 56px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 36px 28px 40px; text-align: center; transition: border-color .25s, background .25s; min-width: 0; }
.panel:hover { border-color: var(--accent); }
.panel svg { width: 64px; height: 40px; margin-bottom: 20px; }
.panel h3 { font-size: 32px; }
.panel p { margin-top: 10px; color: var(--muted); font-size: 16px; }

/* contatti */
.contact { position: relative; margin-top: clamp(80px, 11vw, 144px); border: 1px solid var(--line); border-radius: 28px; padding: clamp(32px, 6vw, 80px) clamp(20px, 5vw, 72px); background: radial-gradient(ellipse 70% 60% at 50% 0%, #e9ecfb 0%, var(--surface) 72%); display: grid; justify-items: center; gap: 28px; text-align: center; scroll-margin-top: 90px; }
.contact h2 { font-size: clamp(36px, 5.4vw, 64px); max-width: 16ch; }
.contact .lead2 { max-width: 56ch; }
.ticks { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px; font-size: 15px; color: var(--fg); list-style: none; margin: 0; padding: 0; }
.ticks li::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 10px; vertical-align: middle; }
form { width: 100%; max-width: 640px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; text-align: left; margin-top: 12px; }
form .full { grid-column: 1 / -1; }
form label { display: grid; gap: 6px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
input, select, textarea { background: transparent; color: var(--fg); border: 0; border-bottom: 1px solid #c2c6dc; padding: 10px 0; font: inherit; font-size: 17px; letter-spacing: 0; text-transform: none; border-radius: 0; width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%); background-position: calc(100% - 10px) 55%, calc(100% - 5px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 24px; }
select option { background: var(--surface); color: var(--fg); }
textarea { resize: vertical; min-height: 90px; }
input:focus, select:focus, textarea:focus { outline: none; border-bottom-color: var(--accent); }
form .btn { justify-self: center; }
.status { min-height: 24px; color: var(--accent); font-size: 14px; text-align: center; }
.addr { font-size: 15px; color: var(--muted); }
.sitefoot { margin-top: 72px; padding-block: 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

/* ===== tablet ===== */
@media (max-width: 980px) {
  .stepper { grid-template-columns: minmax(0, 1fr); gap: 0; margin-top: 56px; max-width: 520px; margin-inline: auto; }
  .stepper::before { top: 25px; bottom: 25px; left: 24.5px; right: auto; width: 1px; height: auto; background: var(--line); }
  .stepper li { justify-items: start; text-align: left; grid-template-columns: 50px minmax(0, 1fr); column-gap: 20px; row-gap: 6px; padding-bottom: 34px; align-content: start; }
  .stepper li:last-child { padding-bottom: 0; }
  .stepper .num { grid-row: 1 / span 2; margin-bottom: 0; }
  .stepper p { max-width: none; }
}

/* ===== mobile ===== */
@media (max-width: 820px) {
  body { font-size: 16.5px; line-height: 1.68; padding-bottom: 0; }
  section.block { scroll-margin-top: 64px; }
  .contact { scroll-margin-top: 76px; }

  /* header compatto con menu a scomparsa */
  .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
  .hdr nav { display: none; }
  .brand { text-align: left; font-size: 16px; letter-spacing: 0.26em; }
  .brand small { display: none; }
  .menu-btn { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 4px 0 14px; background: none; border: 0; color: var(--fg); font: 500 12px/1 var(--body); letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; }
  .menu-btn i { position: relative; width: 22px; height: 10px; display: block; }
  .menu-btn i::before, .menu-btn i::after { content: ""; position: absolute; left: 0; right: 0; height: 1.5px; background: var(--fg); transition: transform .25s, top .25s; }
  .menu-btn i::before { top: 0; }
  .menu-btn i::after { top: 8px; }
  .menu-btn[aria-expanded="true"] i::before { top: 4px; transform: rotate(45deg); }
  .menu-btn[aria-expanded="true"] i::after { top: 4px; transform: rotate(-45deg); }
  .mnav { display: grid; position: absolute; left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); top: 100%; background: var(--bg); border-bottom: 1px solid var(--line); padding: 4px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 24px 40px -24px rgba(20, 22, 43, .25); }
  .mnav a.l { font-family: var(--display); font-weight: 300; font-size: 30px; line-height: 1.1; color: var(--fg); padding: 16px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .mnav a.l::after { content: "→"; font-family: var(--body); font-size: 18px; color: var(--accent); }
  .mnav .btn { margin-top: 22px; width: 100%; }

  /* pulsante di prenotazione fisso, compare dopo l'hero */
  .dock { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 24px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 62%, rgba(247, 247, 251, 0)); opacity: 0; visibility: hidden; transform: translateY(16px); transition: opacity .25s, transform .25s, visibility .25s; pointer-events: none; }
  .dock.on { opacity: 1; visibility: visible; transform: none; }
  .dock .btn { width: 100%; pointer-events: auto; box-shadow: 0 10px 24px -10px rgba(70, 81, 176, .55); }

  /* hero */
  .hero { padding-top: 40px; }
  .hero h1 { font-size: clamp(38px, 11vw, 52px); line-height: 1.04; }
  .hero .lead { font-size: 17px; margin-top: 22px; }
  .hero .actions { flex-direction: column; align-items: stretch; width: 100%; gap: 10px; margin-top: 28px; }
  .hero-art { position: relative; left: auto; top: auto; transform: none; order: 5; width: 100%; height: 190px; margin-top: 32px; }
  .numbers { order: 6; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
  .numbers > div { padding: 22px 8px; }
  .numbers > div + div { border-left: 0; }
  .numbers > div:nth-child(2n) { border-left: 1px solid var(--line); }
  .numbers > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .numbers dd { font-size: 34px; }
  .numbers dt { font-size: 11px; letter-spacing: 0.14em; }

  section.block { padding-block: 68px 0; }
  .label { gap: 12px; font-size: 11px; letter-spacing: 0.24em; }
  .label::before, .label::after { width: 28px; }
  .head { gap: 16px; }
  .head h2 { font-size: clamp(32px, 9vw, 42px); }

  /* metodo: tre righe separate */
  .three { grid-template-columns: minmax(0, 1fr); gap: 0; margin-top: 36px; border-top: 1px solid var(--line); }
  .three > div { padding: 30px 8px; gap: 8px; border-bottom: 1px solid var(--line); }
  .three svg { width: 80px; height: 46px; margin-bottom: 6px; }
  .three h3 { font-size: 36px; }
  .center { margin-top: 32px; }

  /* storia */
  .story { gap: 28px; }
  .round { width: min(270px, 72vw); }
  .prose { gap: 18px; }
  .sig { font-size: 30px; }
  .pull { font-size: 28px; margin-top: 52px; }
  .pull svg { width: 60px; height: 34px; margin-bottom: 20px; }

  /* percorso */
  .stepper { margin-top: 40px; }
  .stepper li { grid-template-columns: 44px minmax(0, 1fr); column-gap: 16px; padding-bottom: 30px; }
  .stepper::before { left: 21.5px; top: 22px; bottom: 22px; }
  .stepper .num { width: 44px; height: 44px; font-size: 19px; }
  .stepper h3 { font-size: 22px; }
  .stepper p { font-size: 15.5px; }
  .chips { margin-top: 36px; gap: 8px; }
  .chip { font-size: 13.5px; padding: 7px 14px; }

  /* a chi è rivolto: card compatte in orizzontale */
  .panels { grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 36px; }
  .panel { display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: 18px; align-items: center; text-align: left; padding: 20px 22px; border-radius: 18px; }
  .panel svg { grid-row: 1 / span 2; width: 56px; height: 34px; margin: 0; }
  .panel h3 { font-size: 26px; }
  .panel p { margin-top: 2px; font-size: 15px; }

  /* contatti */
  .contact { margin-top: 68px; padding: 36px 20px 32px; border-radius: 22px; gap: 22px; }
  .contact h2 { font-size: clamp(32px, 9vw, 42px); }
  .ticks { flex-direction: column; align-items: flex-start; gap: 8px; margin-inline: auto; width: max-content; max-width: 100%; text-align: left; }
  form { grid-template-columns: minmax(0, 1fr); gap: 20px; margin-top: 4px; }
  form .btn { width: 100%; }
  input, select, textarea { padding-block: 12px; }
  .sitefoot { margin-top: 48px; padding-block: 24px calc(24px + env(safe-area-inset-bottom, 0px)); flex-direction: column; gap: 4px; text-align: center; }
}
@media (max-width: 380px) {
  .brand { font-size: 14px; letter-spacing: 0.2em; }
  .hero h1 { font-size: 36px; }
  .mnav a.l { font-size: 27px; }
}
@media (min-width: 821px) { .mnav, .dock, .menu-btn { display: none !important; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .panel, .btn, .hdr nav a, .dock, .menu-btn i::before, .menu-btn i::after { transition: none; } }
</style>
</head>
<body>


<header class="top">
  <div class="wrap hdr">
    <nav class="l" aria-label="Principale">
      <a href="#metodo" data-nav="metodo">Metodo</a>
      <a href="#storia" data-nav="storia">Storia</a>
      <a href="#percorso" data-nav="percorso">Percorso</a>
    </nav>
    <a class="brand" href="#home">Mindset Revolution<small>Sara Rinaldi · Coaching</small></a>
    <nav class="r" aria-label="Secondaria">
      <a href="#perchi" data-nav="perchi">A chi è rivolto</a>
      <a href="#contatti" class="cta">Contatti</a>
    </nav>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="mnav"><span>Menu</span><i aria-hidden="true"></i></button>
  </div>
  <nav class="mnav" id="mnav" aria-label="Menu" hidden>
    <a class="l" href="#metodo">Metodo</a>
    <a class="l" href="#storia">Storia</a>
    <a class="l" href="#percorso">Percorso</a>
    <a class="l" href="#perchi">A chi è rivolto</a>
    <a class="btn" href="#contatti">Prenota l'Intake Session</a>
  </nav>
</header>

<main id="app" class="wrap"></main>

<div class="dock" id="dock"><a class="btn" href="#contatti">Prenota l'Intake Session</a></div>

<script>
const app = document.getElementById("app");
const ACC = "#4651b0", RING = "#d3d7ea", BG = "#f7f7fb";

/* Hero: fascio di linee ondulate, aperto al centro e sfumato ai lati; una linea in accento. */
const heroArt = () => {
  const W = 1200, H = 600, n = 21, acc = 9;
  let g = "";
  for (let i = 0; i < n; i++) {
    const base = 40 + i * (H - 80) / (n - 1);
    let d = "";
    for (let x = 0; x <= W; x += 10) {
      const t = x / W, e = Math.sin(Math.PI * t);
      const y = H / 2 + (base - H / 2) * (0.22 + 0.78 * e) + 46 * Math.sin(t * 6.2 + i * 0.3) * e;
      d += (x === 0 ? "M" : "L") + x + " " + y.toFixed(1) + " ";
    }
    const on = i === acc;
    g += `<path d="${d}" stroke="${on ? ACC : RING}" stroke-opacity="${on ? 0.65 : 1}" stroke-width="${on ? 1.3 : 1}" vector-effect="non-scaling-stroke"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" fill="none" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="wfade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".16" stop-color="#fff"/><stop offset=".84" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="wmask"><rect width="${W}" height="${H}" fill="url(#wfade)"/></mask></defs>
    <g mask="url(#wmask)">${g}</g></svg>`;
};

const miniArcs = n => {
  let s = `<svg viewBox="0 0 96 56" fill="none" aria-hidden="true">`;
  for (let i = 0; i < n; i++) { const r = 12 + i * 12; s += `<path d="M${48 - r} 52 A${r} ${r} 0 0 1 ${48 + r} 52" stroke="${i === n - 1 ? ACC : "#a9aed0"}" stroke-width="1.4" stroke-linecap="round"/>`; }
  s += `<circle cx="48" cy="52" r="2.5" fill="${ACC}"/></svg>`;
  return s;
};
const roundSVG = () => {
  let s = `<svg viewBox="0 0 340 340" fill="none" aria-hidden="true">`;
  [168, 150, 132].forEach((r, i) => s += `<circle cx="170" cy="170" r="${r}" stroke="${i === 1 ? ACC : RING}" stroke-width="1" ${i === 2 ? 'stroke-dasharray="2 6"' : ""}/>`);
  s += `<circle cx="${170 + 150 * Math.cos(-0.9)}" cy="${170 + 150 * Math.sin(-0.9)}" r="4" fill="${ACC}"/></svg>`;
  return s;
};

      <div class="prose">
        <p>Ciao, sono Sara. A 19 anni ho preso in mano la mia vita e ho iniziato a girare il mondo. Non sono diventata una coach restando seduta dietro una scrivania a leggere manuali di teoria.</p>
        <p>Ho viaggiato, esplorato, vissuto da vicino i volti e le storie di culture diverse. Questo viaggio mi ha permesso di sviluppare un dono innato: la capacità di <strong>leggere le persone oltre la superficie</strong>, decodificando i loro reali bisogni in pochi istanti.</p>
        <p>Da oltre 5 anni metto questa sensibilità internazionale al servizio di chiunque desideri una svolta: dai profili junior ai ruoli di livello senior, fino a chi semplicemente vuole ritrovare la bussola nella propria vita quotidiana.</p>
        <p class="sig">Sara Rinaldi</p>
      </div>
    </div>
    <p class="pull">${miniArcs(3)}Il vero successo non è una vetta da raggiungere in solitudine, ma un percorso da fare insieme, proteggendo il tuo tempo, la tua serenità e la tua salute.<small>La mia filosofia: il valore del dono</small></p>
  </section>

  <section class="block" id="percorso">
    <div class="head">
      <p class="label">L'alleanza strategica</p>
      <h2>Si comincia con l'Intake Session.</h2>
      <p>È la base del nostro viaggio: uno spazio protetto, coperto da riservatezza assoluta, in cui mappiamo la tua situazione attuale. Niente schemi rigidi.</p>
    </div>
    <ol class="stepper">
      <li><span class="num">1</span><h3>Decodifica del ruolo e della routine</h3><p>Analizziamo la tua attività professionale o atletica per individuare dove perdi focus o dove si accumula lo stress operativo.</p></li>
      <li><span class="num">2</span><h3>Il potere del «perché»</h3><p>Troviamo la tua vera forza motrice e i valori non negoziabili su cui poggia la tua resilienza.</p></li>
      <li><span class="num">3</span><h3>Mappatura degli ostacoli</h3><p>Affrontiamo sia i limiti esterni (team, mercato, rivalità sportive) sia quelli interni (credenze limitanti, paura di fallire).</p></li>
      <li><span class="num">4</span><h3>Analisi delle aspettative</h3><p>Definiamo le tue priorità assolute: più autostima, gestione agile dei conflitti, organizzazione del tempo.</p></li>
      <li><span class="num">5</span><h3>Logistica personalizzata</h3><p>Un ritmo attivo di incontri, con esercizi pratici da svolgere tra una sessione e l'altra.</p></li>
    </ol>
    <div class="chips"><span class="chip">3–4 sessioni al mese</span><span class="chip">30–45 minuti ciascuna</span><span class="chip">Esercizi tra un incontro e l'altro</span></div>
    <p class="center"><a class="btn" href="#contatti">Prenota l'Intake Session</a></p>
  </section>

  <section class="block" id="perchi">
    <div class="head">
      <p class="label">A chi è rivolto</p>
      <h2>Per chi vuole evolvere senza perdere la serenità.</h2>
    </div>
    <div class="panels">
      <div class="panel">${miniArcs(1)}<h3>Imprenditori</h3><p>Decisioni, team e pressione del mercato.</p></div>
      <div class="panel">${miniArcs(2)}<h3>Atleti</h3><p>Focus, gestione della gara e della rivalità.</p></div>
      <div class="panel">${miniArcs(3)}<h3>Professionisti</h3><p>Dai profili junior ai ruoli di livello senior.</p></div>
      <div class="panel">${miniArcs(4)}<h3>Chi cerca la rotta</h3><p>Ritrovare la bussola nella vita quotidiana.</p></div>
    </div>
  </section>

  ${contactBlock()}`;
}

/* ---- menu mobile ---- */
const menuBtn = document.getElementById("menuBtn"), mnav = document.getElementById("mnav");
function setMenu(open) { mnav.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); }
menuBtn.addEventListener("click", () => setMenu(mnav.hidden));
mnav.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
window.addEventListener("resize", () => { if (innerWidth > 820) setMenu(false); });

/* ---- pulsante fisso: compare dopo l'hero, sparisce vicino ai contatti ---- */
let io;
function wireDock() {
  const dock = document.getElementById("dock");
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) { dock.classList.add("on"); return; }
  const seen = new Map();
  io = new IntersectionObserver(es => {
    es.forEach(e => seen.set(e.target, e.isIntersecting));
    dock.classList.toggle("on", ![...seen.values()].some(Boolean));
  });
  [document.querySelector(".hero .actions"), document.getElementById("contatti"), document.querySelector(".sitefoot")]
    .forEach(t => { if (t) { seen.set(t, false); io.observe(t); } });
}

function wireForm() {
  const f = document.getElementById("cform");
  if (!f) return;
  f.addEventListener("submit", e => {
    e.preventDefault();
    document.getElementById("status").textContent = "Questa è una bozza: il modulo non invia ancora nulla.";
  });
}

function setNav(key) {
  document.querySelectorAll(".hdr nav a[data-nav]").forEach(a => {
    if (a.dataset.nav === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function route() {
  const h = (location.hash || "#home").slice(1);
  const sections = ["metodo", "storia", "percorso", "perchi", "contatti"];
  app.innerHTML = home();
  setNav(sections.includes(h) ? h : "");
  wireForm();
  wireDock();
  setMenu(false);
  const el = sections.includes(h) ? document.getElementById(h) : null;
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();
</script>
